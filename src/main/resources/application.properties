spring.application.name=devtrace-ai
server.port=${SERVER_PORT:8085}

# FalkorDB Configuration (mapped to environment variables with local defaults)
falkordb.host=${FALKORDB_HOST:127.0.0.1}
falkordb.port=${FALKORDB_PORT:6379}
falkordb.username=default
falkordb.password=${FALKORDB_PASSWORD:}
falkordb.graph=${FALKORDB_GRAPH:devtrace}

# DevTrace Application Security Token
devtrace.api.token=${DEVTRACE_API_TOKEN:}

# MCP WebMVC Starter
spring.ai.mcp.server.webmvc.enabled=true
