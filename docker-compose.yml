services:
  falkordb:
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    container_name: devtrace-falkordb
    environment:
      - FALKORDB_ARGS=--requirepass ${FALKORDB_PASSWORD}
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb_data:
